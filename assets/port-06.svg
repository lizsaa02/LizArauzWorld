<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="100" height="100">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100" height="100" filter="url(#noise)" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fondo negro -->
  <rect width="800" height="800" fill="#111111"/>

  <!-- Grain texture -->
  <rect width="800" height="800" fill="url(#grain)"/>

  <!-- Línea roja superior -->
  <rect x="60" y="60" width="80" height="3" fill="#C50505"/>

  <!-- Línea roja inferior -->
  <rect x="660" y="737" width="80" height="3" fill="#C50505"/>

  <!-- Borde sutil -->
  <rect x="30" y="30" width="740" height="740" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- PRÓXIMAMENTE -->
  <text x="50%" y="28%" dominant-baseline="middle" text-anchor="middle"
        font-family="Barlow Condensed, Arial, sans-serif"
        font-size="18" font-weight="600" letter-spacing="12" fill="rgba(255,255,255,0.25)">PRÓXIMAMENTE</text>

  <!-- Línea separadora -->
  <line x1="300" y1="36%" x2="500" y2="36%" stroke="rgba(197,5,5,0.4)" stroke-width="1"/>

  <!-- Label principal -->
  
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
              font-family="Barlow Condensed, Arial Black, sans-serif"
              font-size="80" font-weight="900" letter-spacing="8" fill="#C50505">TIENDA</text>

  <!-- LIZ ARAÚZ firma -->
  <text x="50%" y="76%" dominant-baseline="middle" text-anchor="middle"
        font-family="Barlow Condensed, Arial, sans-serif"
        font-size="14" font-weight="600" letter-spacing="8" fill="rgba(255,255,255,0.15)">LIZ ARAÚZ</text>

</svg>